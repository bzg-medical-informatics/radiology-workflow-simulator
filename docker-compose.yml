services:
  orthanc:
    image: jodogne/orthanc-plugins
    command: /run/secrets/orthanc.json
    ports:
      - "4242:4242"
      - "8042:8042"
    environment:
      ORTHANC_NAME: "ORTHANC"
    volumes:
      - ./orthanc/orthanc.json:/run/secrets/orthanc.json:ro
      - ./orthanc-db:/var/lib/orthanc/db
      - ./worklists:/var/lib/orthanc/worklists
    restart: unless-stopped

  simulator:
    build: ./simulator
    expose:
      - "5000"
    volumes:
      - ./worklists:/app/worklists
      - ./simulator-data:/app/data
    environment:
      ORTHANC_url: "http://orthanc:8042"
      ORTHANC_DICOM_HOST: "orthanc"
      ORTHANC_DICOM_PORT: "4242"
      ORTHANC_PUBLIC_URL: "${ORTHANC_PUBLIC_URL:-http://localhost:8042}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-dev-only-change-me}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    depends_on:
      - orthanc

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Use http://localhost for local development. Set SIM_DOMAIN to a real
      # hostname to enable Caddy's automatic HTTPS certificates.
      SIM_DOMAIN: "${SIM_DOMAIN:-http://localhost}"
      ORTHANC_DOMAIN: "${ORTHANC_DOMAIN:-orthanc.localhost}"
      ORTHANC_PROXY_USER: "${ORTHANC_PROXY_USER:-admin}"
      ORTHANC_PROXY_PASSHASH: "${ORTHANC_PROXY_PASSHASH:-$$2a$$14$$lezIDF0dmUgYxcMC6gdwk.vyrGseRycf3NJWlhsltfsW5QHhbLvIC}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - simulator
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
